<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>AI Workshop 參加者資料</title>
</head>
<body>
<p>正在開啟參加者資料表…</p>
<script>
  // Some mail apps drop the #fragment when opening a link, so accept ?t= as well.
  const fragment = window.location.hash;
  const queryToken = new URLSearchParams(window.location.search).get("t") || "";
  if (fragment) window.location.replace(`./?mode=attendee${fragment}`);
  else if (queryToken) window.location.replace(`./?mode=attendee&t=${encodeURIComponent(queryToken)}`);
  else window.location.replace("./?mode=attendee");
</script>
</body>
</html>
