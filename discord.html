<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>加入 AI Workshop Discord</title>
<style>
  :root{
    --bg:#ece6dc; --card:#faf7f1; --field:#f2ece2; --border:#ded5c6;
    --fg:#33302b; --muted:#6d6255; --accent:#5865f2; --accent-hover:#4752c4;
    --error:#a93428; --error-bg:#f7e5e1;
    --shadow:0 1px 2px rgba(70,55,35,.05), 0 10px 34px rgba(70,55,35,.08);
  }
  *{ box-sizing:border-box; }
  body{ margin:0; min-height:100vh; display:grid; place-items:center; padding:24px 16px; background:var(--bg); color:var(--fg);
    font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang TC","Noto Sans TC",sans-serif; }
  main{ width:min(100%, 520px); padding:30px 28px; border:1px solid var(--border); border-radius:20px; background:var(--card); box-shadow:var(--shadow); text-align:center; }
  .mark{ display:grid; width:58px; height:58px; margin:0 auto 16px; place-items:center; border-radius:17px; background:var(--accent); color:#fff; font-size:1.55rem; font-weight:800; }
  h1{ margin:0; font-size:1.65rem; line-height:1.3; letter-spacing:-.02em; }
  .lead{ margin:12px 0 0; color:var(--muted); }
  .steps{ margin:22px 0; padding:16px 18px; border:1px solid var(--border); border-radius:14px; background:var(--field); text-align:left; }
  .steps p{ margin:0; }
  .steps p + p{ margin-top:7px; }
  button{ width:100%; min-height:52px; border:0; border-radius:13px; background:var(--accent); color:#fff; cursor:pointer; font:700 1rem/1.2 inherit; }
  button:hover{ background:var(--accent-hover); }
  button:focus-visible{ outline:3px solid #252b73; outline-offset:3px; }
  button:disabled{ opacity:.65; cursor:progress; }
  .status{ min-height:1.6em; margin:14px 0 0; color:var(--muted); overflow-wrap:anywhere; }
  .status.error{ padding:10px 12px; border:1px solid color-mix(in srgb, var(--error) 35%, transparent); border-radius:10px; background:var(--error-bg); color:var(--error); }
  .privacy{ margin:18px 0 0; color:var(--muted); font-size:.82rem; }
  [hidden]{ display:none !important; }
  @media(max-width:520px){ main{ padding:26px 20px; border-radius:16px; } }
  @media(prefers-reduced-motion:reduce){ *{ scroll-behavior:auto !important; } }
</style>
</head>
<body>
<main aria-labelledby="title">
  <div class="mark" aria-hidden="true">AI</div>
  <h1 id="title">加入 AI Workshop Discord</h1>
  <p class="lead">付款資格已確認後，請連結你的 Discord 帳號以加入學生社群。</p>
  <section class="steps" aria-label="流程說明">
    <p>1. 登入或建立 Discord 帳號</p>
    <p>2. 同意連結 AI Workshop</p>
    <p>3. 系統加入社群並開通你的課程權限</p>
  </section>
  <button id="continueButton" type="button">繼續使用 Discord</button>
  <p class="status" id="status" role="status" aria-live="polite"></p>
  <p class="privacy">此個人邀請連結只能使用一次，請勿轉寄。</p>
</main>

<script>
  const CLAIM_START_URL = "https://darrenaitool.zeabur.app/webhook/discord-claim-start-2a916bf2c3df4e04a54a0ac625662692";
  const continueButton = document.getElementById("continueButton");
  const status = document.getElementById("status");

  function readClaimToken() {
    const token = new URLSearchParams(window.location.hash.slice(1)).get("claim") || "";
    return /^[a-f0-9]{64,128}$/i.test(token) ? token : "";
  }

  function showError(message) {
    status.textContent = message;
    status.classList.add("error");
    continueButton.disabled = false;
  }

  async function startClaim() {
    const token = readClaimToken();
    if (!token) {
      showError("邀請連結不完整。請回到原始邀請信後再試一次。");
      return;
    }

    continueButton.disabled = true;
    status.classList.remove("error");
    status.textContent = "正在驗證邀請資格…";

    try {
      const response = await fetch(CLAIM_START_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ token }),
      });
      const result = await response.json().catch(() => ({}));
      if (!response.ok || result.ok !== true || typeof result.authorizeUrl !== "string") {
        throw new Error(result.message || "邀請連結無效或已過期，請聯絡 AI Workshop。 ");
      }
      window.location.assign(result.authorizeUrl);
    } catch (error) {
      showError(error.message || "暫時無法連線，請稍後再試。");
    }
  }

  continueButton.addEventListener("click", startClaim);
  if (!readClaimToken()) showError("邀請連結不完整。請回到原始邀請信後再試一次。");
</script>
</body>
</html>
