<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Workshop</title>
<style>
  :root{
    --bg:#ece6dc; --card:#faf7f1; --field:#f2ece2; --border:#ded5c6;
    --fg:#33302b; --muted:#6d6255; --faint:#a69d8d;
    --accent:#e07b39; --accent-strong:#a64512; --accent-text:#8a390e; --accent-weak:#fbe7d7; --accent-fg:#ffffff;
    --ok:#1c9c8e; --ok-bg:#d8efeb; --muted-strong:#5d554a;
    --ring:0 0 0 4px color-mix(in srgb, var(--accent) 24%, transparent);
    --shadow:0 1px 2px rgba(70,55,35,.05), 0 10px 34px rgba(70,55,35,.08);
  }
  *{ box-sizing:border-box; }
  html{ -webkit-text-size-adjust:100%; }
  body{ margin:0; min-width:0; background:var(--bg); color:var(--fg); padding:16px 20px 32px;
    font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang TC","PingFang SC","Noto Sans TC","Noto Sans SC",sans-serif; }
  .wrap{ width:100%; max-width:520px; margin:0 auto; }
  .topbar{ display:flex; justify-content:flex-end; margin-bottom:4px; }
  .langbar{ display:inline-flex; gap:2px; padding:4px; border:1px solid var(--border); border-radius:999px; background:var(--field); }
  .langbar button{ min-height:36px; padding:8px 15px; border:0; border-radius:999px; background:transparent; color:var(--muted); cursor:pointer; font:600 .84rem/1 inherit; }
  .langbar button:hover{ color:var(--fg); }
  .langbar button.active{ background:var(--accent-weak); color:var(--accent-text); box-shadow:inset 0 0 0 1.6px var(--accent); }
  button:focus-visible,a:focus-visible{ outline:none; box-shadow:var(--ring); }
  .brand{ display:flex; align-items:center; gap:14px; margin:0 2px 12px; }
  .logo{ display:grid; width:46px; height:46px; flex:none; place-items:center; border-radius:13px; color:#fff;
    background:linear-gradient(135deg, var(--accent), color-mix(in srgb, var(--accent) 60%, #f6c28a)); box-shadow:var(--shadow); }
  .brand-name{ margin:0; font-size:1.4rem; font-weight:750; letter-spacing:-.01em; }
  .success-card{ padding:18px 22px 20px; border:1px solid var(--border); border-radius:20px; background:var(--card); box-shadow:var(--shadow); text-align:center; }
  .success-icon{ display:grid; width:50px; height:50px; margin:0 auto 12px; place-items:center; border-radius:50%; background:var(--ok-bg); color:var(--ok); }
  .success-icon svg{ width:31px; height:31px; }
  .success-icon.fallback-icon{ background:var(--field); color:var(--muted); }
  .success-card h1{ margin:0; font-size:1.55rem; line-height:1.3; letter-spacing:-.02em; }
  .lead{ margin:10px auto 0; color:var(--muted); overflow-wrap:anywhere; }
  .summary{ margin-top:16px; padding:14px; border:1px solid var(--border); border-radius:14px; background:var(--field); text-align:left; }
  .summary-title{ margin:0 0 12px; color:var(--muted-strong); font-size:.72rem; font-weight:700; letter-spacing:.09em; text-transform:uppercase; }
  dl{ display:grid; grid-template-columns:minmax(0, 1fr); gap:10px; margin:0; }
  .summary-row{ display:grid; grid-template-columns:minmax(0, .8fr) minmax(0, 1.2fr); gap:12px; overflow-wrap:anywhere; }
  dt{ color:var(--muted); }
  dd{ margin:0; font-weight:600; text-align:right; }
  .next-step{ margin:16px 0; color:var(--fg); text-align:left; }
  .return-link{ display:block; width:100%; min-height:52px; padding:13px 16px; border-radius:13px; background:var(--accent-strong); color:var(--accent-fg); box-shadow:0 6px 16px color-mix(in srgb, var(--accent) 28%, transparent); font-weight:700; text-decoration:none; }
  .return-link:hover{ background:color-mix(in srgb, var(--accent) 88%, #000); }
  @media(max-width:520px){
    body{ padding:8px 14px 32px; overflow-x:hidden; }
    .success-card{ padding:20px 18px 18px; border-radius:16px; }
    .langbar button{ padding-inline:11px; }
    .summary{ padding:11px; }
    .summary-title{ margin-bottom:8px; }
  }
  @media (prefers-reduced-motion: reduce){ *{ animation:none !important; transition:none !important; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div class="langbar" aria-label="Language">
      <button type="button" data-lang="zh-Hant">繁體</button>
      <button type="button" data-lang="zh-Hans">简体</button>
      <button type="button" data-lang="en">EN</button>
    </div>
  </div>

  <div class="brand">
    <div class="logo" aria-hidden="true">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.9 4.7L18.6 9.5l-4.7 1.8L12 16l-1.9-4.7L5.4 9.5l4.7-1.8z"/><path d="M19 15l.7 1.8L21.5 17.5l-1.8.7L19 20l-.7-1.8L16.5 17.5l1.8-.7z"/></svg>
    </div>
    <p class="brand-name">AI Workshop</p>
  </div>

  <main class="success-card" aria-live="polite">
    <div class="success-icon" id="successIcon" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 4 4L19 6"/></svg>
    </div>
    <h1 id="title" tabindex="-1"></h1>
    <p class="lead" id="lead"></p>
    <section class="summary" id="summary" aria-labelledby="summaryTitle">
      <h2 class="summary-title" id="summaryTitle"></h2>
      <dl id="summaryRows"></dl>
    </section>
    <p class="next-step" id="nextStep"></p>
    <a class="return-link" id="returnLink" href="./"></a>
  </main>
</div>

<script>
  const SUCCESS_STORAGE_KEY = "workshop_registration_success";
  const LANGS = ["zh-Hant", "zh-Hans", "en"];
  const I18N = {
    "zh-Hant": {
      registerTitle: "報名已完成",
      registerLead: "我們會將報名確認寄送至你的 Email。",
      notifyTitle: "通知登記已完成",
      notifyLead: "新場次開放時，我們會透過 Email 通知你。",
      summaryTitle: "報名摘要",
      emailLabel: "Email",
      workshopLabel: "Workshop",
      ticketLabel: "票種",
      seatsLabel: "席位數",
      seatsSuffix: "位",
      registerNext: "請查看 Email 以取得報名確認與課程資訊。",
      notifyNext: "請留意 Email，取得新場次開放通知。",
      fallbackTitle: "找不到近期的報名資料",
      fallbackLead: "請返回表單查看或重新提交報名。",
      returnLabel: "返回報名表",
      pageTitle: "AI Workshop 報名完成"
    },
    "zh-Hans": {
      registerTitle: "报名已完成",
      registerLead: "我们会将报名确认寄送至你的 Email。",
      notifyTitle: "通知登记已完成",
      notifyLead: "新场次开放时，我们会通过 Email 通知你。",
      summaryTitle: "报名摘要",
      emailLabel: "Email",
      workshopLabel: "Workshop",
      ticketLabel: "票种",
      seatsLabel: "席位数",
      seatsSuffix: "位",
      registerNext: "请查看 Email 以获取报名确认与课程信息。",
      notifyNext: "请留意 Email，获取新场次开放通知。",
      fallbackTitle: "找不到近期的报名资料",
      fallbackLead: "请返回表单查看或重新提交报名。",
      returnLabel: "返回报名表",
      pageTitle: "AI Workshop 报名完成"
    },
    "en": {
      registerTitle: "Registration complete",
      registerLead: "We will send your registration confirmation by email.",
      notifyTitle: "Notification request received",
      notifyLead: "We will notify you by email when new openings are available.",
      summaryTitle: "Registration summary",
      emailLabel: "Email",
      workshopLabel: "Workshop",
      ticketLabel: "Ticket",
      seatsLabel: "Seats",
      seatsSuffix: "seats",
      registerNext: "Please check your email for your confirmation and course information.",
      notifyNext: "Please watch your email for new workshop openings.",
      fallbackTitle: "No recent registration details found",
      fallbackLead: "Return to the form to review or submit your registration.",
      returnLabel: "Return to registration form",
      pageTitle: "AI Workshop registration complete"
    }
  };

  const title = document.getElementById("title");
  const successIcon = document.getElementById("successIcon");
  const lead = document.getElementById("lead");
  const summary = document.getElementById("summary");
  const summaryTitle = document.getElementById("summaryTitle");
  const summaryRows = document.getElementById("summaryRows");
  const nextStep = document.getElementById("nextStep");
  const returnLink = document.getElementById("returnLink");
  const langButtons = document.querySelectorAll(".langbar button");

  function isNonEmptyString(value) {
    return typeof value === "string" && value.trim() !== "";
  }

  function readState() {
    try {
      const state = JSON.parse(sessionStorage.getItem(SUCCESS_STORAGE_KEY));
      if (!state || state.version !== 1 || !["register", "notify"].includes(state.intent) || !LANGS.includes(state.lang) || !isNonEmptyString(state.email)) {
        return null;
      }
      return state;
    } catch (_) {
      return null;
    }
  }

  function detectLang() {
    const saved = localStorage.getItem("reg_lang");
    if (LANGS.includes(saved)) return saved;
    const browserLang = (navigator.language || "").toLowerCase();
    if (browserLang.startsWith("zh")) return (browserLang.includes("cn") || browserLang.includes("hans") || browserLang.includes("sg")) ? "zh-Hans" : "zh-Hant";
    if (browserLang.startsWith("en")) return "en";
    return "zh-Hant";
  }

  function hasDisplayValue(value) {
    return (typeof value === "string" && value.trim() !== "") || (typeof value === "number" && Number.isFinite(value));
  }

  function addRow(label, value) {
    if (!hasDisplayValue(value)) return;
    const row = document.createElement("div");
    const term = document.createElement("dt");
    const description = document.createElement("dd");
    row.className = "summary-row";
    term.textContent = label;
    description.textContent = value;
    row.append(term, description);
    summaryRows.appendChild(row);
  }

  function renderSuccess() {
    const copy = I18N[lang];
    successIcon.textContent = "✓";
    successIcon.classList.remove("fallback-icon");
    summaryRows.replaceChildren();
    summary.hidden = false;

    if (state.intent === "register") {
      title.textContent = copy.registerTitle;
      lead.textContent = copy.registerLead;
      addRow(copy.emailLabel, state.email);
      addRow(copy.workshopLabel, state.workshopName);
      addRow(copy.ticketLabel, state.ticketName);
      addRow(copy.seatsLabel, hasDisplayValue(state.seatCount) ? `${state.seatCount} ${copy.seatsSuffix}` : "");
      nextStep.textContent = copy.registerNext;
      return;
    }

    title.textContent = copy.notifyTitle;
    lead.textContent = copy.notifyLead;
    addRow(copy.emailLabel, state.email);
    nextStep.textContent = copy.notifyNext;
  }

  function renderFallback() {
    const copy = I18N[lang];
    successIcon.textContent = "i";
    successIcon.classList.add("fallback-icon");
    title.textContent = copy.fallbackTitle;
    lead.textContent = copy.fallbackLead;
    summaryRows.replaceChildren();
    summary.hidden = true;
    nextStep.textContent = "";
  }

  function setLang(nextLang) {
    lang = nextLang;
    const copy = I18N[lang];
    document.documentElement.lang = lang;
    document.title = state ? copy.pageTitle : copy.fallbackTitle;
    localStorage.setItem("reg_lang", lang);
    langButtons.forEach((button) => {
      const active = button.dataset.lang === lang;
      button.classList.toggle("active", active);
      button.setAttribute("aria-pressed", String(active));
    });
    summaryTitle.textContent = copy.summaryTitle;
    returnLink.textContent = copy.returnLabel;
    if (state) renderSuccess();
    else renderFallback();
  }

  const state = readState();
  let lang = state?.lang || detectLang();
  langButtons.forEach((button) => button.addEventListener("click", () => setLang(button.dataset.lang)));
  setLang(lang);
  title.focus();
</script>
</body>
</html>
