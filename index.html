<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Workshop 報名表 · Registration</title>
<style>
  :root { --bg:#0b0c10; --card:#15171e; --border:#2a2d38; --fg:#e8eaf0; --muted:#9aa0b0; --accent:#6c8cff; --accent2:#a06cff; --ok:#2ecc71; --err:#ff5c6c; }
  @media (prefers-color-scheme: light){ :root { --bg:#f5f6fa; --card:#ffffff; --border:#e2e5ee; --fg:#1b1d24; --muted:#6b7180; --accent:#3b5bff; --accent2:#8a3bff; } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang TC","PingFang SC","Noto Sans TC","Noto Sans SC",sans-serif; padding:24px; }
  .wrap { max-width:640px; margin:0 auto; }
  .langbar { display:flex; justify-content:flex-end; gap:6px; margin-bottom:12px; }
  .langbar button { width:auto; margin:0; padding:6px 12px; font-size:.85rem; font-weight:600; border:1px solid var(--border);
    border-radius:999px; background:var(--card); color:var(--muted); cursor:pointer; }
  .langbar button.active { border-color:var(--accent); color:var(--fg); background:color-mix(in srgb,var(--accent) 14%,transparent); }
  .hero { text-align:center; padding:8px 0 20px; }
  .hero h1 { font-size:1.5rem; margin:0 0 6px; background:linear-gradient(90deg,var(--accent),var(--accent2)); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; }
  .hero p { color:var(--muted); margin:0; font-size:.95rem; }
  form { background:var(--card); border:1px solid var(--border); border-radius:16px; padding:24px; }
  .field { margin-bottom:18px; }
  label.q { display:block; font-weight:600; margin-bottom:6px; }
  label.q .req { color:var(--err); margin-left:4px; }
  .hint { color:var(--muted); font-size:.82rem; margin-top:4px; }
  input[type=text], input[type=email], input[type=tel], select, textarea {
    width:100%; padding:10px 12px; border-radius:10px; border:1px solid var(--border);
    background:var(--bg); color:var(--fg); font-size:1rem; outline:none;
  }
  input:focus, select:focus, textarea:focus { border-color:var(--accent); }
  .other-input { margin-top:8px; display:none; }
  .other-input.show { display:block; }
  .chips { display:flex; flex-wrap:wrap; gap:8px; }
  .chips label { display:inline-flex; align-items:center; gap:6px; padding:7px 12px; border:1px solid var(--border); border-radius:999px; cursor:pointer; font-size:.9rem; user-select:none; }
  .chips input { accent-color:var(--accent); }
  .chips label:has(input:checked){ border-color:var(--accent); background:color-mix(in srgb, var(--accent) 14%, transparent); }
  .consent { display:flex; align-items:flex-start; gap:10px; font-size:.92rem; }
  .consent input { margin-top:4px; accent-color:var(--accent); }
  button { width:100%; margin-top:8px; padding:13px; border:0; border-radius:12px; font-size:1.05rem; font-weight:700; color:#fff; cursor:pointer; background:linear-gradient(90deg,var(--accent),var(--accent2)); }
  button:disabled { opacity:.55; cursor:progress; }
  .status { margin-top:14px; padding:12px; border-radius:10px; display:none; font-size:.92rem; }
  .status.show { display:block; }
  .status.ok { background:color-mix(in srgb,var(--ok) 16%,transparent); border:1px solid var(--ok); }
  .status.err { background:color-mix(in srgb,var(--err) 16%,transparent); border:1px solid var(--err); }
  .row2 { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  @media(max-width:520px){ .row2 { grid-template-columns:1fr; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="langbar">
    <button type="button" data-lang="zh-Hant">繁體</button>
    <button type="button" data-lang="zh-Hans">简体</button>
    <button type="button" data-lang="en">English</button>
  </div>

  <div class="hero">
    <h1 data-i18n="hero_h1">AI Workshop 報名</h1>
    <p data-i18n="hero_p">填寫下方資料，我們會寄送確認信與課前資料。</p>
  </div>

  <form id="reg">
    <!-- ===== 場次 ===== -->
    <div class="field">
      <label class="q" for="workshop"><span data-i18n="q_workshop">你想報名哪一場 Workshop？</span><span class="req">*</span></label>
      <select id="workshop" required>
        <option value="" data-i18n="opt_ph">— 請選擇 —</option>
        <!-- value = Lark Workshops 表的 record_id；新增場次時在這裡加 option（顯示文字不進 i18n） -->
        <option value="recvp14KDuYGjm" data-name="AI Agent Workshop - London">AI Agent Workshop · London · 2026/07/11</option>
      </select>
    </div>

    <!-- ===== 基本資料 ===== -->
    <div class="row2">
      <div class="field">
        <label class="q" for="fullName"><span data-i18n="q_name">姓名</span><span class="req">*</span></label>
        <input id="fullName" type="text" required autocomplete="name">
      </div>
      <div class="field">
        <label class="q" for="phone" data-i18n="q_phone">手機（選填）</label>
        <input id="phone" type="tel" autocomplete="tel" placeholder="+44 / +886 …">
      </div>
    </div>

    <div class="field">
      <label class="q" for="email"><span data-i18n="q_email">Email</span><span class="req">*</span></label>
      <input id="email" type="email" required autocomplete="email">
      <div class="hint" data-i18n="hint_email">用來發送報名確認、付款通知與課程資料。</div>
    </div>

    <!-- ===== 通訊軟體（必填）===== -->
    <div class="row2">
      <div class="field">
        <label class="q" for="messagingPlatform"><span data-i18n="q_msg_platform">通訊軟體</span><span class="req">*</span></label>
        <select id="messagingPlatform" required>
          <option value="" data-i18n="opt_ph">— 請選擇 —</option>
          <option>LINE</option><option>WhatsApp</option><option>WeChat</option><option>Instagram</option>
        </select>
      </div>
      <div class="field">
        <label class="q" for="messagingId"><span data-i18n="q_msg_id">帳號 / ID</span><span class="req">*</span></label>
        <input id="messagingId" type="text" required data-i18n-ph="ph_msg_id" placeholder="你的 LINE/WeChat/IG/WhatsApp 帳號">
      </div>
    </div>

    <div class="row2">
      <div class="field">
        <label class="q" for="preferredChannel"><span data-i18n="q_preferred">偏好聯絡方式</span><span class="req">*</span></label>
        <select id="preferredChannel" required data-group="preferredChannel"></select>
        <input class="other-input" id="preferredChannel_other" type="text" data-i18n-ph="other_ph" placeholder="請填寫">
      </div>
      <div class="field">
        <label class="q" for="location"><span data-i18n="q_location">所在地區</span><span class="req">*</span></label>
        <select id="location" required data-group="location"></select>
        <input class="other-input" id="location_other" type="text" data-i18n-ph="other_ph" placeholder="請填寫">
      </div>
    </div>

    <div class="row2">
      <div class="field">
        <label class="q" for="customerType"><span data-i18n="q_customerType">你目前的身份</span><span class="req">*</span></label>
        <select id="customerType" required data-group="customerType"></select>
        <input class="other-input" id="customerType_other" type="text" data-i18n-ph="other_ph" placeholder="請填寫">
      </div>
      <div class="field">
        <label class="q" for="company" data-i18n="q_company">公司 / 學校名稱（選填）</label>
        <input id="company" type="text">
      </div>
    </div>

    <!-- ===== 需求 (→ Lead) ===== -->
    <div class="field">
      <label class="q" for="aiExperience"><span data-i18n="q_aiExp">你目前的 AI 使用程度</span><span class="req">*</span></label>
      <select id="aiExperience" required data-group="aiExperience"></select>
    </div>

    <div class="field">
      <label class="q" data-i18n="q_tools">你用過哪些 AI 工具？（選填）</label>
      <div class="chips" data-group="toolsUsed"></div>
      <input class="other-input" id="toolsUsed_other" type="text" data-i18n-ph="other_ph" placeholder="請填寫">
    </div>

    <div class="field">
      <label class="q"><span data-i18n="q_pain">你最想透過 AI 解決什麼問題？</span><span class="req">*</span></label>
      <div class="chips" data-group="painPoints"></div>
      <input class="other-input" id="painPoints_other" type="text" data-i18n-ph="other_ph" placeholder="請填寫">
    </div>

    <div class="field">
      <label class="q"><span data-i18n="q_goal">你參加這場 Workshop 的主要目的？</span><span class="req">*</span></label>
      <div class="chips" data-group="learningGoals"></div>
      <input class="other-input" id="learningGoals_other" type="text" data-i18n-ph="other_ph" placeholder="請填寫">
    </div>

    <div class="field">
      <label class="q" data-i18n="q_interest">你對哪些後續服務有興趣？（選填）</label>
      <div class="chips" data-group="productInterest"></div>
    </div>

    <!-- ===== 來源 (→ Lead) ===== -->
    <div class="row2">
      <div class="field">
        <label class="q" for="leadSource"><span data-i18n="q_leadSource">你從哪裡知道我們的？</span><span class="req">*</span></label>
        <select id="leadSource" required data-group="leadSource"></select>
        <input class="other-input" id="leadSource_other" type="text" data-i18n-ph="other_ph" placeholder="請填寫">
      </div>
      <div class="field">
        <label class="q" for="referralPerson" data-i18n="q_referral">推薦人（選填）</label>
        <input id="referralPerson" type="text">
      </div>
    </div>

    <!-- ===== 同意 (→ Registration) ===== -->
    <div class="field">
      <label class="consent"><input id="consentContact" type="checkbox" required>
        <span><span data-i18n="consent1">我同意主辦方後續就本次報名與我聯絡。</span><span class="req">*</span></span></label>
    </div>
    <div class="field">
      <label class="consent"><input id="marketingConsent" type="checkbox">
        <span data-i18n="consent2">我願意收到未來課程與活動資訊。</span></label>
    </div>

    <button type="submit" id="submitBtn" data-i18n="btn_submit">送出報名</button>
    <div class="status" id="status"></div>
  </form>
</div>

      ["Offline Event",{t:"線下活動",s:"线下活动",e:"Offline event"}],["Online Webinar",{t:"線上講座",s:"线上讲座",e:"Online webinar"}],
      ["Paid Ads",{t:"付費廣告",s:"付费广告",e:"Paid ads"}],["Organic Search",{t:"搜尋引擎",s:"搜索引擎",e:"Organic search"}],
      ["Other",{t:"其他",s:"其他",e:"Other"}] ]}
  };

  const $ = (id) => document.getElementById(id);
  const LK = { "zh-Hant":"t", "zh-Hans":"s", "en":"e" };
  let LANG = detectLang();

  function detectLang(){
    const saved = localStorage.getItem("reg_lang");
    if (saved && LK[saved]) return saved;
    const n = (navigator.language || "").toLowerCase();
    if (n.startsWith("zh")) return (n.includes("cn")||n.includes("hans")||n.includes("sg")) ? "zh-Hans" : "zh-Hant";
    if (n.startsWith("en")) return "en";
    return "zh-Hant";
  }

  // 建立 select / chips（只建一次；label 元素記住三語，切語言時只改字）
  const translatable = []; // {el, map, attr}
  function reg(el, map, attr){ translatable.push({el, map, attr}); }

  function buildSelect(sel){
    const cfg = OPT[sel.dataset.group];
    sel.innerHTML = "";
    if (cfg.ph){ const o=document.createElement("option"); o.value=""; reg(o, I18N.opt_ph, "text"); sel.appendChild(o); }
    cfg.items.forEach(([val,map])=>{ const o=document.createElement("option"); o.value=val; reg(o, map, "text"); sel.appendChild(o); });
  }
  function buildChips(box){
    const cfg = OPT[box.dataset.group];
    box.innerHTML = "";
    cfg.items.forEach(([val,map])=>{
      const lab=document.createElement("label");
      const inp=document.createElement("input"); inp.type="checkbox"; inp.value=val;
      const span=document.createElement("span"); reg(span, map, "text");
      lab.appendChild(inp); lab.appendChild(span); box.appendChild(lab);
    });
  }

  document.querySelectorAll("select[data-group]").forEach(buildSelect);
  document.querySelectorAll(".chips[data-group]").forEach(buildChips);

  // Other 顯示/隱藏
  function wireOther(){
    // select 型
    ["preferredChannel","location","customerType","leadSource"].forEach(g=>{
      const sel=$(g), other=$(g+"_other");
      if(!sel||!other) return;
      sel.addEventListener("change", ()=> toggleOther(other, sel.value==="Other"));
    });
    // chips 型
    ["toolsUsed","painPoints","learningGoals"].forEach(g=>{
      const box=document.querySelector(`.chips[data-group="${g}"]`), other=$(g+"_other");
      if(!box||!other) return;
      box.addEventListener("change", ()=>{
        const otherBox=[...box.querySelectorAll('input')].find(i=>i.value==="Other");
        toggleOther(other, !!(otherBox && otherBox.checked));
      });
    });
  }
  function toggleOther(input, show){ input.classList.toggle("show", show); input.required = show; if(!show) input.value=""; }
  wireOther();

  // 語言切換
  function setLang(lang){
    LANG = lang; const k = LK[lang];
    localStorage.setItem("reg_lang", lang);
    document.documentElement.lang = lang;
    document.title = I18N.title[k];
    document.querySelectorAll("[data-i18n]").forEach(el=>{ const key=el.dataset.i18n; if(I18N[key]) el.textContent = I18N[key][k]; });
    document.querySelectorAll("[data-i18n-ph]").forEach(el=>{ const key=el.dataset.i18nPh; if(I18N[key]) el.placeholder = I18N[key][k]; });
    translatable.forEach(({el,map,attr})=>{ if(attr==="text") el.textContent = map[k]; });
    document.querySelectorAll(".langbar button").forEach(b=> b.classList.toggle("active", b.dataset.lang===lang));
  }
  document.querySelectorAll(".langbar button").forEach(b=> b.addEventListener("click", ()=> setLang(b.dataset.lang)));
  setLang(LANG);

  // 收集 chips；Other 有填字就用填的字取代 "Other"
  function collectGroup(name){
    const box=document.querySelector(`.chips[data-group="${name}"]`);
    let vals=[...box.querySelectorAll("input:checked")].map(i=>i.value);
    const other=$(name+"_other");
    if(other && vals.includes("Other")){
      const txt=other.value.trim();
      vals = vals.map(v=> v==="Other" ? (txt || "Other") : v);
    }
    return vals;
  }
  // select 值；Other 有填字就用填的字
  function selVal(id){
    const sel=$(id), other=$(id+"_other");
    if(sel.value==="Other" && other){ const t=other.value.trim(); if(t) return t; }
    return sel.value;
  }
  const T = () => I18N;   // shorthand
  const k = () => LK[LANG];

  $("reg").addEventListener("submit", async (e) => {
    e.preventDefault();
    const ws = $("workshop");
    const payload = {
      workshopRecordId: ws.value,
      workshopName: ws.selectedOptions[0]?.dataset.name || "",
      formLang: LANG,
      fullName: $("fullName").value.trim(),
      phone: $("phone").value.trim(),
      email: $("email").value.trim(),
      messagingPlatform: $("messagingPlatform").value,
      messagingId: $("messagingId").value.trim(),
      preferredChannel: selVal("preferredChannel"),
      location: selVal("location"),
      customerType: selVal("customerType"),
      company: $("company").value.trim(),
      aiExperience: $("aiExperience").value,
      toolsUsed: collectGroup("toolsUsed"),
      painPoints: collectGroup("painPoints"),
      learningGoals: collectGroup("learningGoals"),
      productInterest: collectGroup("productInterest"),
      leadSource: selVal("leadSource"),
      referralPerson: $("referralPerson").value.trim(),
      consentContact: $("consentContact").checked,
      marketingConsent: $("marketingConsent").checked,
      submittedAt: new Date().toISOString()
    };
    if (payload.painPoints.length === 0 || payload.learningGoals.length === 0) {
      return showStatus(false, T().err_pain_goal[k()]);
    }
    const btn = $("submitBtn"); btn.disabled = true; btn.textContent = T().btn_submitting[k()];
    try {
      const res = await fetch(WEBHOOK_URL, {
        method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload)
      });
      if (!res.ok) throw new Error("HTTP " + res.status);
      showStatus(true, T().ok_msg[k()] + payload.email + (LANG==="en" ? "." : "。"));
      $("reg").reset();
      document.querySelectorAll(".other-input").forEach(i=>toggleOther(i,false));
    } catch (err) {
      showStatus(false, T().err_msg[k()] + err.message + T().err_tail[k()]);
    } finally { btn.disabled = false; btn.textContent = T().btn_submit[k()]; }
  });

  function showStatus(ok, msg){
    const s = $("status");
    s.className = "status show " + (ok ? "ok" : "err");
    s.textContent = msg;
    s.scrollIntoView({behavior:"smooth", block:"nearest"});
  }
</script>
</body>
</html>
